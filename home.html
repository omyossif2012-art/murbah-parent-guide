<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مرجع أولياء الأمور</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      text-align: center;
      color: #126b4f;
    }

    .box {
      margin: 100px auto;
      width: 80%;
      max-width: 700px;
      padding: 40px;
      border: 2px solid #c6a65b;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    p {
      font-size: 24px;
      color: #7a2837;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>
      مَرْجِعُ أَوْلِيَاءِ الأُمُورِ
    </h1>

    <p>
      مدرسة مربح الحلقة الثانية بنات
    </p>

    <p>
      بِالْمِيثَاقِ نَبْلُغُ الْآفَاقَ
    </p>

  </div>

</body>

</html>
