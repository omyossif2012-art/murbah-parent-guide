<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مَرْجِعُ أَوْلِيَاءِ الأُمُورِ</title>


    <!-- =========================================
         بيانات معاينة الرابط في Telegram و WhatsApp

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://omyossif2012-art.github.io/murbah-parent-guide/">

    <meta property="og:title"

          content="مرجع أولياء الأمور - مدرسة مربح الحلقة الثانية بنات">

    <meta property="og:image"

    <meta property="og:image:secure_url"
          content="https://omyossif2012-art.github.io/murbah-parent-guide/og-image.jpg">

    <meta property="og:image:type"
          content="image/jpeg">

    <meta property="og:image:width"
          content="1200">

    <meta property="og:image:height"
          content="630">

    <meta property="og:locale"
          content="ar_AE">


    <!-- =========================================
         بيانات إضافية للمشاركة
    ========================================== -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="مَرْجِعُ أَوْلِيَاءِ الأُمُورِ">

    <meta name="twitter:description"
          content="مرجع أولياء الأمور - مدرسة مربح الحلقة الثانية بنات">

    <meta name="twitter:image"
          content="https://omyossif2012-art.github.io/murbah-parent-guide/og-image.jpg">


    <style>

        /* =====================================
           الخط
        ===================================== */

        @font-face {

            font-family:
                "Sakkal Majalla";

            src:
                local("Sakkal Majalla");

        }


        /* =====================================
           الإعدادات العامة
        ===================================== */

        * {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;

        }


        html,
        body {

            width:
                100%;

            min-height:
                100%;

        }


        body {

            font-family:
                "Sakkal Majalla",
                Arial,
                sans-serif;

            overflow:
                hidden;

            background:
                #ffffff;

        }


        /* =====================================
           صفحة البداية
        ===================================== */

        .opening-page {

            position:
                relative;

            width:
                100%;

            height:
                100vh;

            min-height:
                650px;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            text-align:
                center;

            overflow:
                hidden;

            background-image:
                url("ministry-logo.png");

            background-size:
                cover;

            background-position:
                center center;

            background-repeat:
                no-repeat;

            animation:
                backgroundReveal
                2.5s
                ease-out
                forwards;

        }


        /* =====================================
           طبقة شفافة
        ===================================== */

        .opening-page::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:
                rgba(255,255,255,0.08);

            z-index:
                1;

        }


        /* =====================================
           المحتوى
        ===================================== */

        .opening-content {

            position:
                relative;

            z-index:
                2;

            width:
                90%;

            max-width:
                900px;

            padding:
                35px 25px;

            background:
                rgba(255,255,255,0.86);

            border:
                1px solid
                rgba(198,166,91,0.75);

            border-radius:
                30px;

            box-shadow:
                0 15px 45px
                rgba(0,0,0,0.16);

            animation:
                contentAppear
                1.8s
                ease-out
                0.5s
                both;

        }


        /* =====================================
           الشعارات
        ===================================== */

        .logos {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                22px;

            margin-bottom:
                18px;

        }


        .logo {

            width:
                85px;

            height:
                85px;

            object-fit:
                contain;

            background:
                #ffffff;

            padding:
                6px;

            border-radius:
                16px;

            border:
                1px solid
                #c6a65b;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.10);

        }


        /* =====================================
           اسم المدرسة
        ===================================== */

        .school-name {

            color:
                #126b4f;

            font-size:
                clamp(30px,5vw,45px);

            font-weight:
                bold;

            line-height:
                1.2;

            margin-bottom:
                8px;

        }


        /* =====================================
           عنوان الموقع
        ===================================== */

        .main-title {

            color:
                #7a2837;

            font-size:
                clamp(42px,8vw,70px);

            font-weight:
                bold;

            line-height:
                1.1;

            margin-bottom:
                10px;

        }


        /* =====================================
           الميثاق
        ===================================== */

        .motto {

            color:
                #126b4f;

            font-size:
                clamp(25px,4vw,36px);

            font-weight:
                bold;

            margin-bottom:
                25px;

        }


        /* =====================================
           الخط الزخرفي
        ===================================== */

        .decor-line {

            width:
                120px;

            height:
                3px;

            background:
                #c6a65b;

            margin:
                0 auto 28px;

            border-radius:
                10px;

        }


        /* =====================================
           زر الدخول
        ===================================== */

        .enter-button {

            display:
                inline-flex;

            justify-content:
                center;

            align-items:
                center;

            min-width:
                260px;

            padding:
                14px 35px;

            background:
                #126b4f;

            color:
                white;

            text-decoration:
                none;

            border:
                2px solid
                #c6a65b;

            border-radius:
                50px;

            font-family:
                "Sakkal Majalla",
                Arial,
                sans-serif;

            font-size:
                28px;

            font-weight:
                bold;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.18);

            transition:
                all
                0.35s
                ease;

            animation:
                buttonPulse
                3s
                ease-in-out
                infinite;

        }


        .enter-button:hover {

            background:
                #7a2837;

            transform:
                translateY(-4px)
                scale(1.03);

            box-shadow:
                0 12px 28px
                rgba(0,0,0,0.22);

        }


        /* =====================================
           ظهور الخلفية
        ===================================== */

        @keyframes backgroundReveal {

            from {

                opacity:
                    0;

                background-size:
                    112%;

            }

            to {

                opacity:
                    1;

                background-size:
                    100%;

            }

        }


        /* =====================================
           ظهور المحتوى
        ===================================== */

        @keyframes contentAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(35px)
                    scale(0.96);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =====================================
           نبض الزر
        ===================================== */

        @keyframes buttonPulse {

            0%,
            100% {

                box-shadow:
                    0 8px 20px
                    rgba(0,0,0,0.18);

            }

            50% {

                box-shadow:
                    0 10px 30px
                    rgba(198,166,91,0.35);

            }

        }


        /* =====================================
           الجوال
        ===================================== */

        @media (max-width:600px) {

            .opening-page {

                min-height:
                    600px;

                background-position:
                    center center;

            }


            .opening-content {

                width:
                    92%;

                padding:
                    28px 15px;

                border-radius:
                    24px;

            }


            .logos {

                gap:
                    12px;

                margin-bottom:
                    12px;

            }


            .logo {

                width:
                    65px;

                height:
                    65px;

            }


            .school-name {

                font-size:
                    28px;

            }


            .main-title {

                font-size:
                    43px;

            }


            .motto {

                font-size:
                    24px;

            }


            .enter-button {

                min-width:
                    220px;

                font-size:
                    24px;

                padding:
                    12px 25px;

            }

        }

    </style>

</head>


<body>


<main class="opening-page">


    <div class="opening-content">


        <!-- الشعارات -->

        <div class="logos">


            <img
                src="moe.png.jfif"
                class="logo"
                alt="وزارة التربية والتعليم"
            >


            <img
                src="school-logo.png"
                class="logo"
                alt="مدرسة مربح الحلقة الثانية بنات"
            >


        </div>


        <!-- اسم المدرسة -->

        <div class="school-name">

            مدرسة مربح الحلقة الثانية بنات

        </div>


        <!-- العنوان -->

        <div class="main-title">

            مَرْجِعُ أَوْلِيَاءِ الأُمُورِ

        </div>


        <!-- الميثاق -->

        <div class="motto">

            بِالْمِيثَاقِ نَبْلُغُ الْآفَاقَ

        </div>


        <!-- الخط -->

        <div class="decor-line"></div>


        <!-- زر الدخول -->

        <a
            href="./home.html"
            class="enter-button"
        >

            الدُّخُولُ إِلَى الْمَوْقِعِ

        </a>


    </div>


</main>


</body>

</html>
