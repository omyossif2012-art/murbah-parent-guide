===================================== -->

<main class="opening-page">


    <div class="opening-content">


        <!-- الشعارات -->

            <img
                src="moe.png.jfif"
                class="logo"

        <!-- اسم المدرسة -->

            مدرسة مربح الحلقة الثانية بنات

        </div>


        <!-- العنوان -->

        <div class="main-title">

            مَرْجِعُ أَوْلِيَاءِ الأُمُورِ

        </div>


        <!-- الميثاق -->

        <div class="motto">

            بِالْمِيثَاقِ نَبْلُغُ الْآفَاقَ

        </div>


        <!-- الخط -->

        <div class="decor-line"></div>


        <!-- =================================
             العداد
        ================================== -->

        <div class="countdown-title">

            🎒 موعد دوام الطالبات

        </div>


        <div class="countdown">


            <div class="time-box">

                <span
                    class="time-number"
                    id="days">
                    00
                </span>

                <span class="time-label">
                    يوم
                </span>

            </div>


            <div class="time-box">

                <span
                    class="time-number"
                    id="hours">
                    00
                </span>

                <span class="time-label">
                    ساعة
                </span>

            </div>


            <div class="time-box">

                <span
                    class="time-number"
                    id="minutes">
                    00
                </span>

                <span class="time-label">
                    دقيقة
                </span>

            </div>


            <div class="time-box">

                <span
                    class="time-number"
                    id="seconds">
                    00
                </span>

                <span class="time-label">
                    ثانية
                </span>

            </div>


        </div>


        <!-- زر الدخول -->

        <a
            href="./home.html"
            class="enter-button">

            الدُّخُولُ إِلَى الْمَوْقِعِ

        </a>


    </div>

<script>

/* =========================================
   عداد موعد دوام الطالبات
   31 أغسطس 2026 - الساعة 7:00 صباحًا
   بتوقيت الإمارات
========================================= */

const targetDate =
    new Date(
        "2026-08-31T07:00:00+04:00"
    ).getTime();


function updateCountdown() {

    const now =
        new Date().getTime();

    const distance =
        targetDate - now;


    if (distance <= 0) {

        document.getElementById("days").textContent =
            "00";

        document.getElementById("hours").textContent =
            "00";

        document.getElementById("minutes").textContent =
            "00";

        document.getElementById("seconds").textContent =
            "00";


        document.querySelector(".countdown-title").textContent =
            "🎉 أهلاً بعودة طالباتنا العزيزات";


        return;

    }


    const days =
        Math.floor(
            distance /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (distance %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (distance %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (distance %
            (1000 * 60)) /
            1000
        );


    document.getElementById("days").textContent =
        String(days).padStart(2, "0");


    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);

</script>
